<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Inicio</ion-title>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/login"></ion-back-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Inicio</ion-title>
    </ion-toolbar>
  </ion-header>

  <div id="container">
    <ion-card>
      <ion-card-header>
        <h6>Bienvenido {{user}}</h6>
        <div class="contenedor">
          <img src="./assets/imgs/tyler.jpg" alt="" class="foto">
        </div>
      </ion-card-header>

      <!-- Comienza la sección del generador de QR -->
      <ion-card-content>
        <ion-item>
          <ion-label position="floating">Texto a convertir</ion-label>
          <ion-input [(ngModel)]="qrCodeData"></ion-input>
        </ion-item>

        <ion-button expand="block" (click)="generateQRCode()">Generar QR</ion-button>

        <div *ngIf="qrCodeResult" class="qr-code-container">
          <h3>Código QR Generado:</h3>
          <img [src]="'data:image/svg+xml;base64,' + qrCodeResult" alt="Código QR" />
        </div>
      </ion-card-content>
    </ion-card>
  </div>
</ion-content>
