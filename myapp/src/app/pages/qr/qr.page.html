<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title> 
      QR 
    </ion-title>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/inicio"></ion-back-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding ion-text-center">


  <ion-segment [(ngModel)]="segment">
    <ion-segment-button value="scan">
      <ion-label>Scan QR</ion-label>
    </ion-segment-button>

    <ion-segment-button value="generate">
      <ion-label>Generate QR</ion-label>
    </ion-segment-button>

  </ion-segment>


  <div *ngIf="segment === 'scan'">
    if segment is equal to scan
  </div>


  <div class="segment" *ngIf="segment === 'generate'">
    <div class="segment-content">

      <div id="qrImage">
        <div class="d-flex-center">
          <div class="d-flex-center qr-wrapper">
            <qr-code [value]="qrText" size="190" errorCorrectionLevel="M"/>
          </div>

        </div>
        <div class="ion-padding-top">{{qrText}} </div>
      </div>

    </div>
  </div>


</ion-content>
