<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Registro</ion-title>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/"></ion-back-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Registro</ion-title>
    </ion-toolbar>
  </ion-header>

  <div id="container">
    <ion-card>
      <ion-card-header>
        <ion-card-subtitle>Formulario de Registro</ion-card-subtitle>
      </ion-card-header>

      <ion-card-content>
        <ion-list>
          <!-- Nombre de usuario -->
          <ion-item>
            <ion-input
              [(ngModel)]="user.username"
              label="Usuario"
              labelPlacement="floating"
              placeholder="Ingrese su nombre de usuario">
            </ion-input>
          </ion-item>

          <!-- Correo electrónico -->
          <ion-item>
            <ion-input
              [(ngModel)]="user.email"
              label="Correo"
              labelPlacement="floating"
              placeholder="Ingrese su correo electrónico">
            </ion-input>
          </ion-item>

          <!-- Contraseña -->
          <ion-item>
            <ion-input
              type="password"
              [(ngModel)]="user.password"
              label="Contraseña"
              labelPlacement="floating"
              placeholder="Ingrese su contraseña">
              <ion-input-password-toggle slot="end"></ion-input-password-toggle>
            </ion-input>
          </ion-item>

          <!-- Fecha de nacimiento -->
          <ion-item>
            <ion-input
              [(ngModel)]="user.fecha_nacimiento"
              label="Fecha de Nacimiento"
              labelPlacement="floating"
              type="date">
            </ion-input>
          </ion-item>

          <!-- RUT (formato chileno) -->
          <ion-item>
            <ion-input
              [(ngModel)]="user.rut"
              label="RUT"
              labelPlacement="floating"
              placeholder="Ingrese su RUT (Ejemplo: 12345678-9)">
            </ion-input>
          </ion-item>
        </ion-list>

        <!-- Indicador de carga -->
        <div *ngIf="burbuja">
          <ion-item>
            <ion-label>Registrando</ion-label>
            <ion-spinner name="bubbles"></ion-spinner>
          </ion-item>
        </div>

        <!-- Botón para registrar -->
        <ion-button
          class="btnregistrar"
          fill="outline"
          (click)="registrar()">
          Registrar
        </ion-button>
      </ion-card-content>
    </ion-card>
  </div>
</ion-content>
